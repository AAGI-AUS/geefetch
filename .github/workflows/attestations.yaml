name: attestations
on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: geefetch
      - name: Build source tarball
        run: R CMD build geefetch
      - name: Generate attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'geefetch_*.tar.gz'
      - name: Attach tarball + attestation to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: 'geefetch_*.tar.gz'
