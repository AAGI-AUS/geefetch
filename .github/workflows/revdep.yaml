# Manual revdep run; gated to release tags and dispatch.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

name: revdep

permissions: read-all

jobs:
  revdep:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::revdepcheck, local::.
          needs: revdep
          working-directory: geefetch

      - name: revdep_check
        run: |
          revdepcheck::revdep_check(num_workers = 4, quiet = FALSE)
        shell: Rscript {0}
        working-directory: geefetch

      - name: Upload revdep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: revdep-results
          path: geefetch/revdep/
