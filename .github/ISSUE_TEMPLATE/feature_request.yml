name: Feature request
description: Propose a new feature or enhancement
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Lead with the user problem, not the proposed solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behaviour
      description: Sketch the function signature, defaults, and one or two call sites.
      render: r

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - New GEE dataset (add a read_* alias)
        - Existing reader enhancement (params / output shape)
        - Batch extraction behaviour (collect_gee_data)
        - Auth / setup workflow
        - Caching / performance
        - Documentation / vignette
        - CI / tooling
        - Other

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I have checked this is not already implemented
          required: true
        - label: I have checked this is in scope for this package (see DESCRIPTION and SUPPORT.md §"What we don't support")
          required: true
