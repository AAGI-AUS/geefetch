repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/posit-dev/air
    rev: 0.5.0
    hooks:
      - id: air

  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3
    hooks:
      - id: style-files
      - id: lintr
      - id: parsable-R
      - id: no-browser-statement
      - id: no-debug-statement
      - id: spell-check
      - id: deps-in-desc

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

# Subdir-package layout note:
# The package lives at geefetch/; R/ and DESCRIPTION are therefore under
# geefetch/. If a precommit hook runs against the wrong root, override
# via .pre-commit-config.local.yaml or pass --files <path> when invoking
# manually.
