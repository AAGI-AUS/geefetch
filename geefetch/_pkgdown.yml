url: https://aagi-aus.github.io/geefetch/

template:
  bootstrap: 5
  bslib:
    primary: "#2E7D32"

home:
  title: "geefetch — Python-free Google Earth Engine for R"
  description: >
    Extract environmental covariates from Google Earth Engine without Python.
    Pure R interface via the GEE REST API with automatic caching and batch extraction.
  links:
    - text: Report a bug
      href: https://github.com/AAGI-AUS/geefetch/issues
    - text: GEE Data Catalog
      href: https://developers.google.com/earth-engine/datasets

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/geefetch.html
    articles:
      text: Articles
      menu:
        - text: Getting Started
          href: articles/geefetch.html
        - text: Batch Extraction
          href: articles/collect_gee_data.html
        - text: Custom Datasets
          href: articles/custom_datasets.html

reference:
  - title: "GEE Readers"
    desc: "Extract raster data from Google Earth Engine collections."
    contents:
      - read_gee
      - read_modis_ndvi
      - read_modis_lst
      - read_era5
      - read_chirps
      - read_srtm
      - read_slga
      - read_sentinel2
      - read_landsat
      - read_worldclim

  - title: "Batch Extraction"
    desc: "Extract point values across multiple locations, dates, and datasets."
    contents:
      - collect_gee_data

  - title: "Authentication"
    desc: "Authenticate with Google Earth Engine and check connection status."
    contents:
      - gee_auth
      - gee_status
      - gee_setup

  - title: "Utilities"
    desc: "Browse datasets, register custom collections, manage cache."
    contents:
      - gee_datasets
      - gee_register_dataset
      - gee_external_facts
      - gee_clear_cache
      - gee_cache_disk

articles:
  - title: "Getting Started"
    contents:
      - geefetch
  - title: "Workflows"
    contents:
      - collect_gee_data
      - custom_datasets
